set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

setw -g mode-keys vi
set -g mouse on
setw -g alternate-screen on

# Enter copy mode with prefix + [
bind [ copy-mode

# Visual selection (v = char, V = line, C-v = block)
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi C-v send -X rectangle-toggle

# Yank to macOS clipboard
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Also yank on Enter
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

# Paste from macOS clipboard with Ctrl+V
bind-key -n C-v run "pbpaste | tmux load-buffer - && tmux paste-buffer"

# Shuffle current window left/right with Shift+Arrow
bind -n S-Left swap-window -t -1\; select-window -t -1
bind -n S-Right swap-window -t +1\; select-window -t +1
